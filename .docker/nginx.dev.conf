# Docker's embedded DNS. Without an explicit resolver, nginx resolves the
# upstream once at startup and caches it forever — so recreating the `app`
# container (a rebuild, a `compose up` after an image change) leaves this
# container pointing at an IP nothing answers on, and every request 502s until
# nginx is restarted by hand. With the resolver plus a variable in
# fastcgi_pass, the name is resolved per request instead.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /var/www/app/public;
    index index.php;
    client_max_body_size 20M;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # PHP-FPM in the separate 'app' container (dev compose). The upstream goes
    # through a variable on purpose: nginx only re-resolves names that appear
    # in a variable — a literal `fastcgi_pass app:9000;` is resolved once at
    # startup regardless of the resolver above.
    set $fpm_upstream app:9000;

    location ~ \.php$ {
        fastcgi_pass $fpm_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri /index.php?$query_string;
        expires off;
        log_not_found off;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
