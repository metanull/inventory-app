; Xdebug — step debugging for VS Code (PHP Debug extension) and any other
; DBGp client.
;
; Off by default: Xdebug is compiled into the dev image so it is there when you
; want it, but an always-on debugger costs real time on every request and every
; composer/artisan invocation. Turn it on per-container with the XDEBUG_MODE
; environment variable, which Xdebug reads in preference to this file:
;
;   docker compose run --rm -e XDEBUG_MODE=debug app php artisan ...
;
; or set XDEBUG_MODE on the service in compose.yml while you need it.
xdebug.mode=off
xdebug.start_with_request=yes
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
; Suppress verbose internal logging in the container log
xdebug.log_level=0
