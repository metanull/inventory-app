name: "Setup Node Project"
description: "Install Node.js, enable Corepack, and install npm dependencies in a given working directory"

inputs:
  working-directory:
    description: "Directory containing package.json to install dependencies for"
    default: "."
  registry-url:
    description: "npm registry URL (leave empty for the public registry only)"
    default: ""
  node-auth-token:
    description: "Token used to authenticate to a private registry (e.g. GitHub Packages)"
    default: ""

runs:
  using: "composite"
  steps:
    - name: "Setup > Image > Install Node.js"
      uses: actions/setup-node@v6
      with:
        node-version: "lts/Krypton"
        registry-url: ${{ inputs.registry-url }}

    - name: "Setup > node > Enable Corepack"
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token }}
      run: |
        corepack enable

    - name: "Setup > npm > Install Dependencies"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token }}
      run: |
        npm ci --no-audit --no-fund
