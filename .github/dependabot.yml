# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ Exporters and viewers are covered by GLOB, not by hand. Adding a forked  │
# │ exporter or a new viewer needs NO change here: it lands inside one of    │
# │ the `directories:` patterns below and is picked up on the next run. A    │
# │ new tool directly under scripts/ is the exception — see the entry that   │
# │ lists them, and why it cannot glob.                                      │
# │                                                                          │
# │ The registry/token split is structural, not a rule someone has to        │
# │ remember. Only /spa (@metanull/inventory-app-api-client) and the viewers │
# │ (@metanull/<dataset>-data) consume an @metanull package, so only their   │
# │ entry carries `registries: [npm-github]` — which is also what hands the  │
# │ PAT to the update job. Exporters and tools resolve entirely from the     │
# │ public registry and are deliberately in entries that carry no            │
# │ credential at all. A new project inherits the right answer from where    │
# │ its directory sits.                                                      │
# │                                                                          │
# │ Dependabot opens ONE PULL REQUEST PER DIRECTORY by default, so a glob    │
# │ does not couple the projects it matches: a failing bump in one exporter  │
# │ does not block the others. Setting `group-by: dependency-name` on a      │
# │ group would collapse them into one PR across directories — don't,        │
# │ unless the PR volume ever becomes the problem.                           │
# └──────────────────────────────────────────────────────────────────────────┘

version: 2
updates:
  - package-ecosystem: "composer" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly" # Check the npm registry for updates every week
    labels:
      - "php"
      - "dependencies"
    groups:
      laravel-dev-dependencies:
        dependency-type: "development"
      laravel-prod-dependencies:
        dependency-type: "production"

  # Root project. No @metanull dependency, so no registry and no PAT.
  - package-ecosystem: "npm"
    directory: "/" # Look for `package.json` and `lock` files in the `root` directory
    schedule:
      interval: "weekly" # Check the npm registry for updates every week
    labels:
      - "npm"
      - "dependencies"
    groups:
      node-dev-dependencies:
        dependency-type: "development"
      node-prod-dependencies:
        dependency-type: "production"

  # Node tooling directly under scripts/ — currently importer and site-i18n.
  #
  # Listed rather than globbed, and this is the one place the glob scheme does
  # not reach. `/scripts/*` here made the WHOLE FILE invalid: Dependabot
  # rejected it with "cannot determine if 'npm' has overlapping directories",
  # because it cannot prove `/scripts/*` disjoint from `/scripts/exporters/*`
  # and `/scripts/viewers/*` below — true though that is, since
  # scripts/exporters and scripts/viewers hold no manifest of their own.
  #
  # An invalid file is not a degraded file: nothing runs at all, composer,
  # bundler, docker and github-actions included. Between #1633 (2026-08-31) and
  # this, no Dependabot pull request of any kind was opened.
  #
  # So a NEW TOOL DIRECTLY UNDER scripts/ needs a line here. Exporters and
  # viewers — the ones that actually multiply, and the reason #1633 introduced
  # globs — keep theirs.
  - package-ecosystem: "npm"
    directories:
      - "/scripts/importer"
      - "/scripts/site-i18n"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      tools-dev-dependencies:
        dependency-type: "development"
      tools-prod-dependencies:
        dependency-type: "production"

  # Dataset exporters. Public npm registry only: exporters read the database and
  # write JSON, they do not consume any @metanull package. Keep this entry free
  # of `registries:` so the PAT is never handed to a job that cannot use it.
  - package-ecosystem: "npm"
    directories:
      - "/scripts/exporters/*"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      exporter-dev-dependencies:
        dependency-type: "development"
      exporter-prod-dependencies:
        dependency-type: "production"

  # /spa and the dataset viewers — the only projects that install an @metanull
  # package from GitHub Packages, and therefore the only ones that need the
  # registry and its PAT.
  #
  # The PAT is required. Do not remove this key to rely on Dependabot's own
  # GITHUB_TOKEN: that was tried here as a deliberate canary (#1612) and it
  # does not work for these packages. With the key absent, Dependabot ran
  # with credentials-metadata carrying `git_source` alone — no npm_registry
  # credential of any kind — and the job died on
  #
  #   401 https://npm.pkg.github.com/@metanull%2Finventory-app-api-client
  #   {"error":"authentication token not provided"}
  #
  # The 2026-06-23 "automatic Dependabot access to GitHub-hosted registries"
  # change does not cover this case, even though these packages do grant this
  # repository read access — the deploy workflows install them with the
  # workflow GITHUB_TOKEN. The likeliest reason is that they are published
  # under a personal account rather than an organization, but the log only
  # shows that no token was sent, not why.
  #
  # Measured in the same trigger that produced the 401: all six viewers, on
  # the PAT path, succeeded and opened update PRs (#1611 bumped a private
  # @metanull data package). The PAT is valid and the scope mapping from
  # #1609 works. Revisit only with evidence, not with the changelog.
  - package-ecosystem: "npm"
    directories:
      - "/spa"
      - "/scripts/viewers/*"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      viewer-dev-dependencies:
        dependency-type: "development"
      viewer-prod-dependencies:
        dependency-type: "production"
    registries:
      - npm-github

  # The docs site. No Gemfile.lock is committed (it is gitignored), which
  # Dependabot handles: it bumps the requirements in the Gemfile itself.
  #
  # This entry exists because nothing else watches Ruby here. The weekly
  # dependency audit covers Composer and npm only, so the docs gems aged
  # unwatched until an external scanner flagged them.
  - package-ecosystem: "bundler"
    directory: "/docs"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      docs-dependencies:
        patterns:
          - ".*"

  # Base images across .docker/ and scripts/import-tool/. The Ruby base image
  # of the docs container is the thing the scanner actually reported: a gem
  # bump would not have moved it, because the interpreter comes from the FROM
  # line rather than from the Gemfile.
  - package-ecosystem: "docker"
    directories:
      - "/.docker"
      - "/scripts/import-tool"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      docker-base-images:
        patterns:
          - ".*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      github-actions-dependencies:
        patterns:
          - ".*"

# `scope` is not optional here, and leaving it out does not degrade gracefully:
# Dependabot aborts the whole job during file fetching with
#   "Private npm registries require either a .npmrc file in your repository,
#    or explicit `scope`/`replaces-base` configuration in dependabot.yml."
# so no update PR is ever opened for the project. Every entry carrying
# `registries: [npm-github]` — /spa and all six viewers — failed that way from
# the day the registry was introduced until this was added.
#
# It has to be `scope` and not `replaces-base: true`, which is the other option
# the error message offers. `replaces-base` makes npm.pkg.github.com the base
# registry for the project, so vue, vite and every other public dependency
# would be resolved there too and 404. `scope` maps the one scope we actually
# host and leaves the default registry alone: Dependabot generates an .npmrc
# from these credentials at update time.
#
# One scope covers both consumers — @metanull/inventory-app-api-client in /spa
# and @metanull/<dataset>-data in the viewers. A second scope would need a
# second registry entry; Dependabot does not accept a list here.
#
# The repository has no committed .npmrc to infer this from, and should not:
# .npmrc is gitignored precisely because it holds the token, and only
# .npmrc.example is tracked.
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    scope: "@metanull"                                      # must start with '@'; see the note above before removing
    token: ${{secrets.DEPENDABOT_GITHUB_PACKAGES_TOKEN}}    # PAT with read:packages scope, stored as a Dependabot secret (Settings > Secrets and variables > Dependabot)
