# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ THIS FILE IS MAINTAINED BY HAND. Dependabot config is static YAML with   │
# │ no scripting, so it CANNOT enumerate directories the way the CI and      │
# │ dependency-audit matrices now do.                                        │
# │                                                                          │
# │ Adding a Node project under scripts/ (a forked exporter or viewer, a     │
# │ new tool) means adding an `npm` entry here as well. THIS IS ENFORCED:    │
# │ the `Dependabot Coverage` job in continuous-integration.yml runs         │
# │ scripts/check-dependabot-coverage.sh on every pull request and blocks    │
# │ the merge when this file and the tree disagree — a project with no entry │
# │ here, or an entry whose directory no longer exists.                      │
# │                                                                          │
# │ Viewers additionally need `registries: [npm-github]`: they install       │
# │ @metanull/<dataset>-data from GitHub Packages. Exporters must not have   │
# │ the key at all. That rule is enforced by the same check.                 │
# │                                                                          │
# │ Current coverage: root, spa, scripts/importer, scripts/site-i18n,        │
# │ every scripts/exporters/* and every scripts/viewers/*.                   │
# │                                                                          │
# │ These entries also pin the weekly `npm audit` matrix in                  │
# │ dependency-audit.yml, which derives from the same enumeration. Deleting  │
# │ an entry whose project still exists fails the check above; a project     │
# │ dropping out of the enumeration leaves its entry ORPHANED, which fails   │
# │ it too. Neither list can shrink quietly.                                 │
# │                                                                          │
# │ Run the check yourself before pushing:                                   │
# │   docker run --rm -v "$PWD:/repo" -w /repo --entrypoint sh \             │
# │     mikefarah/yq:4 scripts/check-dependabot-coverage.sh                  │
# └──────────────────────────────────────────────────────────────────────────┘

version: 2
updates:
  - package-ecosystem: "composer" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly" # Check the npm registry for updates every week
    labels:
      - "php"
      - "dependencies"
    groups:
      laravel-dev-dependencies:
        dependency-type: "development"
      laravel-prod-dependencies:
        dependency-type: "production"

  - package-ecosystem: "npm"
    directory: "/" # Look for `package.json` and `lock` files in the `root` directory
    schedule:
      interval: "weekly" # Check the npm registry for updates every week
    labels:
      - "npm"
      - "dependencies"
    groups:
      node-dev-dependencies:
        dependency-type: "development"
      node-prod-dependencies:
        dependency-type: "production"
    registries:
      - npm-github

  - package-ecosystem: "npm"
    directory: "/spa"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      spa-dev-dependencies:
        dependency-type: "development"
      spa-prod-dependencies:
        dependency-type: "production"
    # The PAT is required. Do not remove this key to rely on Dependabot's own
    # GITHUB_TOKEN: that was tried here as a deliberate canary (#1612) and it
    # does not work for these packages. With the key absent, Dependabot ran
    # with credentials-metadata carrying `git_source` alone — no npm_registry
    # credential of any kind — and the job died on
    #
    #   401 https://npm.pkg.github.com/@metanull%2Finventory-app-api-client
    #   {"error":"authentication token not provided"}
    #
    # The 2026-06-23 "automatic Dependabot access to GitHub-hosted registries"
    # change does not cover this case, even though these packages do grant this
    # repository read access — the deploy workflows install them with the
    # workflow GITHUB_TOKEN. The likeliest reason is that they are published
    # under a personal account rather than an organization, but the log only
    # shows that no token was sent, not why.
    #
    # Measured in the same trigger that produced the 401: all six viewers, on
    # the PAT path, succeeded and opened update PRs (#1611 bumped a private
    # @metanull data package). The PAT is valid and the scope mapping from
    # #1609 works. Revisit only with evidence, not with the changelog.
    registries:
      - npm-github

  - package-ecosystem: "npm"
    directory: "/scripts/importer"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      importer-dev-dependencies:
        dependency-type: "development"
      importer-prod-dependencies:
        dependency-type: "production"

  - package-ecosystem: "npm"
    directory: "/scripts/site-i18n"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      site-i18n-dev-dependencies:
        dependency-type: "development"
      site-i18n-prod-dependencies:
        dependency-type: "production"

  # --- Dataset exporters (one entry per scripts/exporters/<dataset>) ---------
  # Public npm registry only: exporters read the database and write JSON, they
  # do not consume any @metanull package.

  - package-ecosystem: "npm"
    directory: "/scripts/exporters/amulets"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      exporter-amulets-dev-dependencies:
        dependency-type: "development"
      exporter-amulets-prod-dependencies:
        dependency-type: "production"

  - package-ecosystem: "npm"
    directory: "/scripts/exporters/baroqueart"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      exporter-baroqueart-dev-dependencies:
        dependency-type: "development"
      exporter-baroqueart-prod-dependencies:
        dependency-type: "production"

  - package-ecosystem: "npm"
    directory: "/scripts/exporters/carpets"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      exporter-carpets-dev-dependencies:
        dependency-type: "development"
      exporter-carpets-prod-dependencies:
        dependency-type: "production"

  - package-ecosystem: "npm"
    directory: "/scripts/exporters/islamicart"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      exporter-islamicart-dev-dependencies:
        dependency-type: "development"
      exporter-islamicart-prod-dependencies:
        dependency-type: "production"

  - package-ecosystem: "npm"
    directory: "/scripts/exporters/sharinghistory"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      exporter-sharinghistory-dev-dependencies:
        dependency-type: "development"
      exporter-sharinghistory-prod-dependencies:
        dependency-type: "production"

  - package-ecosystem: "npm"
    directory: "/scripts/exporters/the-use-of-colours-in-art"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      exporter-the-use-of-colours-in-art-dev-dependencies:
        dependency-type: "development"
      exporter-the-use-of-colours-in-art-prod-dependencies:
        dependency-type: "production"

  - package-ecosystem: "npm"
    directory: "/scripts/exporters/water-in-islam"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      exporter-water-in-islam-dev-dependencies:
        dependency-type: "development"
      exporter-water-in-islam-prod-dependencies:
        dependency-type: "production"

  # --- Dataset viewers (one entry per scripts/viewers/<dataset>) -------------
  # These DO need `registries: [npm-github]` — each installs its data package
  # @metanull/<dataset>-data from GitHub Packages.

  - package-ecosystem: "npm"
    directory: "/scripts/viewers/amulets"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      viewer-amulets-dev-dependencies:
        dependency-type: "development"
      viewer-amulets-prod-dependencies:
        dependency-type: "production"
    registries:
      - npm-github

  - package-ecosystem: "npm"
    directory: "/scripts/viewers/carpets"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      viewer-carpets-dev-dependencies:
        dependency-type: "development"
      viewer-carpets-prod-dependencies:
        dependency-type: "production"
    registries:
      - npm-github

  - package-ecosystem: "npm"
    directory: "/scripts/viewers/baroqueart"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      viewer-baroqueart-dev-dependencies:
        dependency-type: "development"
      viewer-baroqueart-prod-dependencies:
        dependency-type: "production"
    registries:
      - npm-github

  - package-ecosystem: "npm"
    directory: "/scripts/viewers/islamicart"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      viewer-islamicart-dev-dependencies:
        dependency-type: "development"
      viewer-islamicart-prod-dependencies:
        dependency-type: "production"
    registries:
      - npm-github

  - package-ecosystem: "npm"
    directory: "/scripts/viewers/sharinghistory"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      viewer-sharinghistory-dev-dependencies:
        dependency-type: "development"
      viewer-sharinghistory-prod-dependencies:
        dependency-type: "production"
    registries:
      - npm-github

  - package-ecosystem: "npm"
    directory: "/scripts/viewers/the-use-of-colours-in-art"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      viewer-the-use-of-colours-in-art-dev-dependencies:
        dependency-type: "development"
      viewer-the-use-of-colours-in-art-prod-dependencies:
        dependency-type: "production"
    registries:
      - npm-github

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      github-actions-dependencies:
        patterns:
          - ".*"

# `scope` is not optional here, and leaving it out does not degrade gracefully:
# Dependabot aborts the whole job during file fetching with
#   "Private npm registries require either a .npmrc file in your repository,
#    or explicit `scope`/`replaces-base` configuration in dependabot.yml."
# so no update PR is ever opened for the project. Every entry carrying
# `registries: [npm-github]` — /spa and all six viewers — failed that way from
# the day the registry was introduced until this was added.
#
# It has to be `scope` and not `replaces-base: true`, which is the other option
# the error message offers. `replaces-base` makes npm.pkg.github.com the base
# registry for the project, so vue, vite and every other public dependency
# would be resolved there too and 404. `scope` maps the one scope we actually
# host and leaves the default registry alone: Dependabot generates an .npmrc
# from these credentials at update time.
#
# One scope covers both consumers — @metanull/inventory-app-api-client in /spa
# and @metanull/<dataset>-data in the viewers. A second scope would need a
# second registry entry; Dependabot does not accept a list here.
#
# The repository has no committed .npmrc to infer this from, and should not:
# .npmrc is gitignored precisely because it holds the token, and only
# .npmrc.example is tracked.
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    scope: "@metanull"                                      # must start with '@'; see the note above before removing
    token: ${{secrets.DEPENDABOT_GITHUB_PACKAGES_TOKEN}}    # PAT with read:packages scope, stored as a Dependabot secret (Settings > Secrets and variables > Dependabot)