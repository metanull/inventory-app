name: Dependency Audit (Full Tree)

permissions:
  contents: read
  packages: read
  issues: write

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

  workflow_dispatch:

concurrency:
  group: dependency-audit
  cancel-in-progress: true

jobs:

  audit-composer:
    name: Audit - Composer (PHP)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: "Setup > Image > Install php"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: fileinfo, intl, zip, sqlite3, pdo_sqlite, gd, exif
          github-token: ""

      - name: "Setup > Composer > Install Dependencies"
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: "Check > Composer > Audit Vulnerabilities"
        run: |
          composer audit

  audit-npm:
    name: Audit - npm (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Root
            directory: .
            registry-url: ""
          - name: SPA
            directory: spa
            registry-url: https://npm.pkg.github.com/
          - name: Importer
            directory: scripts/importer
            registry-url: ""
          - name: Exporter (islamicart)
            directory: scripts/exporters/islamicart
            registry-url: ""
          - name: Viewer (islamicart)
            directory: scripts/viewers/islamicart
            registry-url: https://npm.pkg.github.com/

    steps:
      - uses: actions/checkout@v7

      - name: "Setup > Node Project"
        uses: ./.github/actions/setup-node-project
        with:
          working-directory: ${{ matrix.directory }}
          registry-url: ${{ matrix.registry-url }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Check > npm > Audit Vulnerabilities"
        working-directory: ${{ matrix.directory }}
        run: |
          npm audit --audit-level high

  report:
    name: Report Failures
    runs-on: ubuntu-latest
    needs: [audit-composer, audit-npm]
    if: always() && (needs.audit-composer.result == 'failure' || needs.audit-npm.result == 'failure')

    steps:
      - name: Open or update tracking issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Weekly dependency audit found vulnerabilities"
          BODY="The weekly dependency audit found one or more vulnerable dependencies (HIGH severity or above). See the failed jobs in [this run]($RUN_URL) for details, then run \`composer audit\` / \`npm audit\` locally in the affected directory to reproduce."

          EXISTING=$(gh issue list --repo "${{ github.repository }}" --search "\"$TITLE\" in:title" --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" --label dependencies
          fi
